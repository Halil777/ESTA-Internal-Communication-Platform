[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

; Docker bridge mode must advertise the PBX host IP to phones. Do not put the
; phone LAN here as local_net, otherwise Asterisk sends its container IP in SDP.
external_media_address = 10.10.20.231
external_signaling_address = 10.10.20.231
external_signaling_port = 5060
local_net = 172.16.0.0/12
