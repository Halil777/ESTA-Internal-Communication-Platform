[global]
type = global
user_agent = Esta Connect PBX

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060
external_media_address = __ASTERISK_PUBLIC_IP__
external_signaling_address = __ASTERISK_PUBLIC_IP__
external_signaling_port = 5060

; Asterisk runs in Docker bridge mode. LAN phones must receive the PBX host IP
; in SIP Contact and SDP, not the container IP such as 172.18.0.2. Keep only the
; Docker/container network local so PJSIP rewrites LAN clients to external_*.
local_net = __ASTERISK_PJSIP_LOCAL_NET__
