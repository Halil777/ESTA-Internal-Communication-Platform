services:
  postgres:
    image: postgres:16-alpine
    container_name: esta_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: esta_connect
      POSTGRES_USER: esta_user
      POSTGRES_PASSWORD: esta_strong_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esta_user -d esta_connect"]
      interval: 10s
      timeout: 5s
      retries: 10

  asterisk:
    build:
      context: ./docker/asterisk
    container_name: esta_asterisk
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASTERISK_PUBLIC_IP: ${ASTERISK_PUBLIC_IP:-10.10.20.231}
      ASTERISK_LOCAL_NET: ${ASTERISK_LOCAL_NET:-10.10.20.0/24}
      ASTERISK_RTP_START: "${RTP_START_PORT:-10000}"
      ASTERISK_RTP_END: "${RTP_END_PORT:-10100}"
      ASTERISK_AMI_USER: ${ASTERISK_AMI_USER:-esta_ami_user}
      ASTERISK_AMI_SECRET: ${ASTERISK_AMI_SECRET:-esta_ami_password}
      ASTERISK_ARI_USER: ${ASTERISK_ARI_USER:-esta_ari_user}
      ASTERISK_ARI_SECRET: ${ASTERISK_ARI_SECRET:-esta_ari_password}
      ASTERISK_ODBC_DSN: esta_pbx
      ASTERISK_ODBC_HOST: postgres
      ASTERISK_ODBC_PORT: 5432
      ASTERISK_ODBC_DATABASE: esta_connect
      ASTERISK_ODBC_USER: esta_user
      ASTERISK_ODBC_PASSWORD: esta_strong_password
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "${RTP_START_PORT:-10000}-${RTP_END_PORT:-10100}:${RTP_START_PORT:-10000}-${RTP_END_PORT:-10100}/udp"
      - "127.0.0.1:5038:5038/tcp"
      - "127.0.0.1:8088:8088/tcp"
    volumes:
      - asterisk_config:/etc/asterisk
      - asterisk_logs:/var/log/asterisk
      - asterisk_spool:/var/spool/asterisk

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: esta_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      asterisk:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: esta_connect
      DB_USER: esta_user
      DB_PASS: esta_strong_password
      DB_SYNCHRONIZE: "false"
      JWT_SECRET: ${JWT_SECRET:-EstaConnect_JWT_Secret_Key_2024_VeryLong_ChangeInProd}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-EstaConnect_Refresh_Secret_Key_2024_VeryLong_ChangeInProd}
      JWT_REFRESH_EXPIRES_IN: 7d
      SIP_ENCRYPTION_KEY: ${SIP_ENCRYPTION_KEY:-EstaConnect32CharEncryptionKey!!}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123456}
      ASTERISK_HOST: asterisk
      ASTERISK_AMI_PORT: 5038
      ASTERISK_AMI_RECONNECT_MS: 10000
      ASTERISK_AMI_RECONNECT_MAX_MS: 60000
      ASTERISK_AMI_USER: ${ASTERISK_AMI_USER:-esta_ami_user}
      ASTERISK_AMI_SECRET: ${ASTERISK_AMI_SECRET:-esta_ami_password}
      ASTERISK_ARI_URL: http://asterisk:8088
      ASTERISK_ARI_USER: ${ASTERISK_ARI_USER:-esta_ari_user}
      ASTERISK_ARI_SECRET: ${ASTERISK_ARI_SECRET:-esta_ari_password}
      ASTERISK_SIP_DOMAIN: ${ASTERISK_PUBLIC_IP:-10.10.20.231}
      ASTERISK_SIP_PORT: 5060
      ASTERISK_SIP_TRANSPORT: UDP
      ASTERISK_PJSIP_TRANSPORT_SECTION: transport-udp
      ASTERISK_PJSIP_CONFIG_FILE: pjsip.endpoints.conf
      ASTERISK_PROVISIONING_MODE: both
      RTP_START_PORT: "${RTP_START_PORT:-10000}"
      RTP_END_PORT: "${RTP_END_PORT:-10100}"
      RECORDINGS_PATH: /var/lib/esta-pbx/recordings
    ports:
      - "3001:3001"

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: esta_admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  asterisk_config:
  asterisk_logs:
  asterisk_spool:
